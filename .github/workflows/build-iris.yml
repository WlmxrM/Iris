name: Build Iris

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Fijar version de VolmLib
        run: |
          grep -rl 'master-SNAPSHOT' --include='*.gradle' --include='*.kts' --include='*.properties' --include='*.toml' . | xargs sed -i 's/master-SNAPSHOT/b5e5254fed/g'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew buildBukkit -PpluginOutDirectory=build/out --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: iris-jars
          path: build/out/*.jar
          if-no-files-found: error
